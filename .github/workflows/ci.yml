name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 单元测试矩阵: ubuntu 走 make, windows 验证 README 记载的"纯 gcc 无 make"路径
  unit-tests:
    name: unit-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests (make)
        if: runner.os == 'Linux'
        run: make test

      - name: Doc-sync assertions (tools/docsync.sh)
        if: runner.os == 'Linux'
        run: sh tools/docsync.sh

      - name: Run unit tests (pure gcc, no make)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build
          gcc -std=c99 -Wall -Wextra -pedantic -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/host \
              -o build/et_tests.exe core/*.c algorithm/*.c sys/*.c protocol/*.c drivers/*.c debug/*.c storage/*.c \
              port/host/port_host.c test/*.c
          ./build/et_tests.exe

      - name: Build demo
        if: runner.os == 'Linux'
        run: make demo

  # gcov 覆盖率门槛: 行覆盖 ≥85% (P4 指标; 与 Makefile/README 命令保持同步)
  coverage:
    name: coverage (gcovr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pip install gcovr

      - name: Build & run tests with coverage
        run: |
          mkdir -p build
          gcc -std=c99 -Wall -Wextra -pedantic --coverage \
              -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/host \
              -o build/et_tests_cov.exe core/*.c algorithm/*.c sys/*.c protocol/*.c drivers/*.c debug/*.c storage/*.c \
              port/host/port_host.c test/*.c
          ./build/et_tests_cov.exe

      - name: Generate coverage report (gate ≥85% lines)
        run: |
          gcovr --print-summary --txt-summary -o coverage_summary.txt \
                --fail-under-line 85 --xml -o coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage_summary.txt

  # STM32F103 移植编译验证 (Cortex-M3, 零警告门槛)
  cross-stm32f103:
    name: cross stm32f103
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build stm32f103 demo
        run: |
          mkdir -p build
          arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -std=c99 -Wall -Wextra -pedantic -Os -g \
            -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/stm32f103 \
            -T port/stm32f103/stm32f103c8t6.ld -nostartfiles \
            core/*.c algorithm/*.c sys/*.c protocol/*.c drivers/*.c debug/*.c storage/*.c \
            port/stm32f103/port_stm32f103.c port/stm32f103/startup_stm32f103.c \
            examples/stm32f103_demo.c \
            -o build/stm32f103_demo.elf
          arm-none-eabi-size build/stm32f103_demo.elf

  # STM32G474 移植编译验证 (v1.6 双平台回归, Cortex-M4, 零警告门槛):
  # -D 三宏 = G4 flash 几何(2KB 页), port 层 #error 守卫验证漏配即编译失败
  cross-stm32g474:
    name: cross stm32g474
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build stm32g474 demo
        run: |
          mkdir -p build
          arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -std=c99 -Wall -Wextra -pedantic -Os -g \
            -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/stm32g474 \
            -DPORT_FLASH_SECTOR_SIZE=2048 -DPORT_FLASH_SECTOR_COUNT=16 -DPORT_FLASH_ERASE_MS_MAX=40 \
            -T port/stm32g474/stm32g474vet6.ld -nostartfiles \
            core/*.c algorithm/*.c sys/*.c protocol/*.c drivers/*.c debug/*.c storage/*.c \
            port/stm32g474/port_stm32g474.c port/stm32g474/startup_stm32g474.c \
            examples/stm32g474_demo.c \
            -o build/stm32g474_demo.elf
          arm-none-eabi-size build/stm32g474_demo.elf

      - name: Verify geometry #error guard (build without -D must fail)
        run: |
          if arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -std=c99 -Wall -Wextra -pedantic -Os \
            -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/stm32g474 \
            -c port/stm32g474/port_stm32g474.c -o /dev/null 2>/dev/null; then
            echo "ERROR: geometry guard did not fire"; exit 1
          fi
          echo "geometry #error guard verified"

  # Renode 仿真常设门 (v1.3): headless 跑 F103 demo, 断言串口关键日志
  # (横幅 / kv stats / UTC 心跳 / boot #1 / 复位后 boot #2) —— 仿真验收
  # 从"本地截图"升级为 CI 门, v1.1 起的仿真挂账就此闭环
  renode-smoke:
    name: renode stm32f103 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build stm32f103 demo
        run: |
          mkdir -p build
          arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -std=c99 -Wall -Wextra -pedantic -Os -g \
            -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/stm32f103 \
            -T port/stm32f103/stm32f103c8t6.ld -nostartfiles \
            core/*.c algorithm/*.c sys/*.c protocol/*.c drivers/*.c debug/*.c storage/*.c \
            port/stm32f103/port_stm32f103.c port/stm32f103/startup_stm32f103.c \
            examples/stm32f103_demo.c \
            -o build/stm32f103_demo.elf
          arm-none-eabi-size build/stm32f103_demo.elf

      - name: Install Renode (pinned 1.16.1)
        run: |
          curl -sL --retry 3 --retry-delay 5 -o /tmp/renode.tar.gz \
            https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz
          mkdir -p "$HOME/renode"
          tar xzf /tmp/renode.tar.gz -C "$HOME/renode"
          chmod +x "$HOME/renode/renode_1.16.1-dotnet_portable/renode"

      - name: Run Renode smoke (assert uart log)
        run: |
          sh port/stm32f103/renode/smoke.sh \
            "$HOME/renode/renode_1.16.1-dotnet_portable/renode" \
            "$HOME/renode/renode_1.16.1-dotnet_portable" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/renode-smoke"

      - name: Upload uart log (always, 排障用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-uart-log
          path: build/renode-smoke/
