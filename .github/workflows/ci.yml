name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 单元测试矩阵: ubuntu 走 make, windows 验证 README 记载的"纯 gcc 无 make"路径
  unit-tests:
    name: unit-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests (make WERROR=1, host zero-warning gate, v2.6 P2-1)
        if: runner.os == 'Linux'
        run: make WERROR=1 test

      - name: Run unit tests (1K block variant, make test-1k, v2.6 P1-6)
        if: runner.os == 'Linux'
        run: make test-1k

      - name: Run self-checking recipe examples (make ex, v2.3)
        if: runner.os == 'Linux'
        run: make WERROR=1 ex
      - name: Run unit tests (shell Tab variant, v2.0)
        if: runner.os == 'Linux'
        run: make test-tab

      - name: Run unit tests under AddressSanitizer (make test-asan, v2.5 AC-8)
        if: runner.os == 'Linux'
        run: make test-asan

      - name: Run 1K variant under AddressSanitizer (make test-asan-1k, v2.6 P1-6)
        if: runner.os == 'Linux'
        run: make test-asan-1k

      - name: API inventory consistency (tools/apidump.sh --check, v2.0)
        if: runner.os == 'Linux'
        run: sh tools/apidump.sh --check

      - name: Upload API inventory artifact (v2.0 P4)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: api-inventory
          path: docs/API_INVENTORY.md

      - name: Doc-sync assertions (tools/docsync.sh)
        if: runner.os == 'Linux'
        run: sh tools/docsync.sh

      - name: Run unit tests (pure gcc, no make, WERROR host gate v2.6 P2-1)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build
          gcc -std=c99 -Wall -Wextra -pedantic -Werror -DET_MODULE_SELFTEST=1 -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/host \
              -o build/et_tests.exe core/*.c algorithm/*.c sys/*.c protocol/*.c drivers/*.c debug/*.c storage/*.c \
              port/host/port_host.c test/*.c
          ./build/et_tests.exe

      - name: Build demo
        if: runner.os == 'Linux'
        run: make demo

  # gcov 覆盖率门槛: 行覆盖 ≥85% (P4 指标; 与 Makefile/README 命令保持同步)
  coverage:
    name: coverage (gcovr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pip install gcovr

      - name: Build & run tests with coverage (Makefile 单一来源, v2.0 P0-2)
        run: |
          mkdir -p build
          make coverage-build

      - name: Generate coverage report (gate ≥85% lines)
        run: |
          gcovr --print-summary --txt-summary -o coverage_summary.txt \
                --fail-under-line 85 --xml -o coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage_summary.txt

  # CMake 接入面验证 (v2.29 P1-2, REQ-10 / N-01) —— **新增 job, 不替代任何 Makefile job**
  # 覆盖面: host 构建零警告 + 模块裁剪位形 + install/export 后的 find_package 消费
  #         + 六个自检式示例经 CTest 跑通。源列表漂移由 docsync 的 P1-2 断言把守。
  cmake-integration:
    name: cmake integration (v2.29 P1-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake + ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Host configure & build (C99, -Werror, 六例经 CTest)
        run: |
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DET_WERROR=ON -DET_BUILD_EXAMPLES=ON
          cmake --build build-cmake
          ctest --test-dir build-cmake --output-on-failure

      - name: Module-off configure (关 KV 与 LOG, 空 TU 位形须能编能链)
        run: |
          rm -rf build-off
          cmake -S . -B build-off -G Ninja -DET_WERROR=ON \
                -DET_MODULE_KV=0 -DET_MODULE_LOG=0 -DET_BUILD_EXAMPLES=ON
          cmake --build build-off

      - name: Disabled modules carry no symbols (HC-8① 口径 = 无目标代码/符号)
        run: |
          mkdir -p build
          # 对象扩展名随平台: Linux/Ninja 产 .o, Windows 产 .obj ⇒ 按存在者取, 不写死
          KV_OFF=$(ls build-off/CMakeFiles/embedded_tools.dir/storage/et_kv.c.o \
                      build-off/CMakeFiles/embedded_tools.dir/storage/et_kv.c.obj 2>/dev/null | head -1)
          LOG_OFF=$(ls build-off/CMakeFiles/embedded_tools.dir/debug/et_log.c.o \
                       build-off/CMakeFiles/embedded_tools.dir/debug/et_log.c.obj 2>/dev/null | head -1)
          KV_ON=$(ls build-cmake/CMakeFiles/embedded_tools.dir/storage/et_kv.c.o \
                     build-cmake/CMakeFiles/embedded_tools.dir/storage/et_kv.c.obj 2>/dev/null | head -1)
          nm "$KV_OFF" | grep -E '[TtDdBbRrWw] et_' | tee build/kv-off-symbols.txt
          test "$(grep -c '[TtDdBbRrWw] et_' build/kv-off-symbols.txt)" -eq 0
          nm "$LOG_OFF" | grep -E '[TtDdBbRrWw] et_' | tee build/log-off-symbols.txt
          test "$(grep -c '[TtDdBbRrWw] et_' build/log-off-symbols.txt)" -eq 0
          # 对照面: 默认位形下同一命令必须数得出符号(证明上一条不是空 grep 假绿)
          test "$(nm "$KV_ON" | grep -c '[TtDdBbRrWw] et_')" -gt 0

      - name: install + find_package(et CONFIG) 消费样例 (5 行接入)
        run: |
          rm -rf build-prefix build-consumer
          cmake -S . -B build-cmake-install -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build-prefix"
          cmake --build build-cmake-install
          cmake --install build-cmake-install
          mkdir -p build-consumer && cd build-consumer
          cat > CMakeLists.txt <<'CEOF'
          cmake_minimum_required(VERSION 3.20)
          project(et_consumer C)
          find_package(et CONFIG REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE et::embedded_tools)
          CEOF
          cat > main.c <<'CEOF'
          #include <stdio.h>
          #include "et_ringbuf.h"
          #include "et_kv.h"
          #include "port_host.h"
          static uint8_t mem[16];
          static et_ringbuf_t rb;
          int main(void) {
              uint8_t w[3] = {1u, 2u, 3u}, r[3];
              port_host_flash_reset();
              if (!et_ringbuf_init(&rb, mem, sizeof mem)) return 1;
              if (et_ringbuf_write(&rb, w, 3u) != 3u) return 2;
              if (et_ringbuf_read(&rb, r, 3u) != 3u) return 3;
              printf("[consumer] ringbuf ok, et_kv header visible=%d\n", ET_MODULE_KV);
              return 0;
          }
          CEOF
          cmake -S . -B b -G Ninja -DCMAKE_PREFIX_PATH="$OLDPWD/build-prefix"
          cmake --build b
          ./b/consumer

      - name: Cross configure via toolchain files (零警告位形)
        run: |
          sudo apt-get install -y gcc-arm-none-eabi
          cmake -S . -B build-arm-g474 -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-g474.cmake -DET_WERROR=ON
          cmake --build build-arm-g474
          cmake -S . -B build-arm-f103 -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-f103.cmake -DET_WERROR=ON
          cmake --build build-arm-f103

      - name: Doc-sync dual-source assertion (tools/docsync.sh, P1-2 同一入口)
        run: sh tools/docsync.sh

  # STM32F103 移植编译验证 (Cortex-M3, 零警告门槛)
  cross-stm32f103:
    name: cross stm32f103
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build via docbuild (README 单一来源, v2.0 P0-2)
        run: |
          mkdir -p build
          sh tools/docbuild.sh

      - name: Size readings to summary and artifact (v2.0 P0-3, 表行为本机环境读数)
        run: |
          arm-none-eabi-size build/stm32f103_demo.elf build/stm32f103_demo_selftest.elf | tee build/sizes-f103.txt
          cat build/sizes-f103.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload size readings
        uses: actions/upload-artifact@v4
        with:
          name: sizes-stm32f103
          path: build/sizes-f103.txt

  # STM32G474 移植编译验证 (v1.6 双平台回归, Cortex-M4, 零警告门槛):
  # -D 三宏 = G4 flash 几何(2KB 页), port 层 #error 守卫验证漏配即编译失败
  cross-stm32g474:
    name: cross stm32g474
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build via docbuild (README 单一来源, v2.0 P0-2)
        run: |
          mkdir -p build
          sh tools/docbuild.sh

      - name: Size readings to summary + artifact (v2.0 P0-3)
        run: |
          arm-none-eabi-size build/stm32g474_demo.elf | tee build/sizes-g474.txt
          cat build/sizes-g474.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload size readings
        uses: actions/upload-artifact@v4
        with:
          name: sizes-stm32g474
          path: build/sizes-g474.txt

      - name: Verify geometry #error guard (build without -D must fail)
        run: |
          if arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -std=c99 -Wall -Wextra -pedantic -Os \
            -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/stm32g474 \
            -c port/stm32g474/port_stm32g474.c -o /dev/null 2>/dev/null; then
            echo "ERROR: geometry guard did not fire"; exit 1
          fi
          echo "geometry #error guard verified"

  # Renode 仿真常设门 (v1.3): headless 跑 F103 demo, 断言串口关键日志
  # (横幅 / kv stats / UTC 心跳 / boot #1 / 复位后 boot #2) —— 仿真验收
  # 从"本地截图"升级为 CI 门, v1.1 起的仿真挂账就此闭环
  docbuild:
    name: docbuild (README 命令可执行化)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Execute port README docbuild blocks verbatim
        run: |
          mkdir -p build
          sh tools/docbuild.sh

  renode-smoke:
    name: renode stm32f103 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build via docbuild (README 单一来源; smoke 消费 _selftest elf)
        run: |
          mkdir -p build
          sh tools/docbuild.sh

      - name: Install Renode (pinned 1.16.1)
        run: |
          curl -sL --retry 3 --retry-delay 5 -o /tmp/renode.tar.gz \
            https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz
          mkdir -p "$HOME/renode"
          tar xzf /tmp/renode.tar.gz -C "$HOME/renode"
          chmod +x "$HOME/renode/renode_1.16.1-dotnet_portable/renode"

      - name: Run Renode smoke (assert uart log)
        run: |
          sh port/stm32f103/renode/smoke.sh \
            "$HOME/renode/renode_1.16.1-dotnet_portable/renode" \
            "$HOME/renode/renode_1.16.1-dotnet_portable" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/renode-smoke"

      - name: Upload uart log (always, 排障用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-uart-log
          path: build/renode-smoke/
