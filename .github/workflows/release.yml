name: Release

# 发布: 打 tag v* 后触发 → 验证门(全量单测 + Renode smoke) → 构建 + GitHub Release 附件
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 发布前验证门: 单测 + 仿真 smoke (P3-1: 失败不出版本)
  verify:
    name: verify (tests + renode smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Run full unit tests
        run: make test

      - name: Build via docbuild (README 单一来源, v2.0 P0-2; smoke 消费 _selftest elf)
        run: |
          mkdir -p build
          sh tools/docbuild.sh

      - name: Install Renode (pinned 1.16.1)
        run: |
          curl -sL --retry 3 --retry-delay 5 -o /tmp/renode.tar.gz \
            https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz
          mkdir -p "$HOME/renode"
          tar xzf /tmp/renode.tar.gz -C "$HOME/renode"
          chmod +x "$HOME/renode/renode_1.16.1-dotnet_portable/renode"

      - name: Run Renode smoke
        run: |
          sh port/stm32f103/renode/smoke.sh \
            "$HOME/renode/renode_1.16.1-dotnet_portable/renode" \
            "$HOME/renode/renode_1.16.1-dotnet_portable" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/renode-smoke"

  # 验证门通过后才构建发布件
  release:
    name: build & release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build host demo
        run: make demo

      - name: Build via docbuild (README 单一来源, v2.0 P0-2; 产物=默认无宏构建)
        run: |
          mkdir -p build
          sh tools/docbuild.sh
          arm-none-eabi-size build/stm32f103_demo.elf build/stm32f103_demo_selftest.elf

      - name: Generate SHA256SUMS
        run: |
          cd build
          sha256sum stm32f103_demo.elf stm32f103_demo.bin demo.exe > SHA256SUMS

      - name: Build release body from CHANGELOG section (v2.0 P3-1 双源漂移终结)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { keep = 1; next }
            keep && /^## \[/              { keep = 0 }
            keep { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "ERROR: CHANGELOG.md 无版本 $VER 对应节 (发布前须先随交付更新)"; exit 1
          fi
          printf '
---
发布验证: CI verify 门(全量单测 + Renode smoke + docbuild)已过; 工件与构建环境见交付文档复现表。
' >> release_body.md
          head -8 release_body.md

      - name: Draft GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            build/stm32f103_demo.elf
            build/stm32f103_demo.bin
            build/demo.exe
            build/SHA256SUMS
          fail_on_unmatched_files: false