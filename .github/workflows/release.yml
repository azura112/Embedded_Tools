name: Release

# 发布: 打 tag v* 后触发 → 验证门(全量单测 + Renode smoke) → 构建 + GitHub Release 附件
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 发布前验证门: 单测 + 仿真 smoke (P3-1: 失败不出版本)
  verify:
    name: verify (tests + renode smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Run full unit tests
        run: make test

      - name: Build stm32f103 demo
        run: |
          mkdir -p build
          arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -std=c99 -Wall -Wextra -pedantic -Os -g \
            -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/stm32f103 \
            -T port/stm32f103/stm32f103c8t6.ld -nostartfiles \
            core/*.c algorithm/*.c sys/*.c protocol/*.c drivers/*.c debug/*.c storage/et_kv.c \
            port/stm32f103/port_stm32f103.c port/stm32f103/startup_stm32f103.c \
            examples/stm32f103_demo.c \
            -o build/stm32f103_demo.elf
          arm-none-eabi-size build/stm32f103_demo.elf

      - name: Install Renode (pinned 1.16.1)
        run: |
          curl -sL --retry 3 --retry-delay 5 -o /tmp/renode.tar.gz \
            https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz
          mkdir -p "$HOME/renode"
          tar xzf /tmp/renode.tar.gz -C "$HOME/renode"
          chmod +x "$HOME/renode/renode_1.16.1-dotnet_portable/renode"

      - name: Run Renode smoke
        run: |
          sh port/stm32f103/renode/smoke.sh \
            "$HOME/renode/renode_1.16.1-dotnet_portable/renode" \
            "$HOME/renode/renode_1.16.1-dotnet_portable" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/renode-smoke"

  # 验证门通过后才构建发布件
  release:
    name: build & release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Build host demo
        run: make demo

      - name: Build stm32f103 demo (ELF + BIN)
        run: |
          mkdir -p build
          arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -std=c99 -Wall -Wextra -pedantic -Os -g \
            -I. -Icore -Ialgorithm -Isys -Iprotocol -Idrivers -Idebug -Istorage -Iport -Iport/stm32f103 \
            -T port/stm32f103/stm32f103c8t6.ld -nostartfiles \
            core/*.c algorithm/*.c sys/*.c protocol/*.c drivers/*.c debug/*.c storage/et_kv.c \
            port/stm32f103/port_stm32f103.c port/stm32f103/startup_stm32f103.c \
            examples/stm32f103_demo.c \
            -o build/stm32f103_demo.elf
          arm-none-eabi-objcopy -O binary build/stm32f103_demo.elf build/stm32f103_demo.bin
          arm-none-eabi-size build/stm32f103_demo.elf

      - name: Draft GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/stm32f103_demo.elf
            build/stm32f103_demo.bin
            build/demo.exe
          fail_on_unmatched_files: false